<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="180mm" viewBox="0 0 180 180">
  <title>MagPilot magnet baseline — five named placement marks</title>
  <desc>Print at actual size. The board outline is 150 by 150 millimetres. Protocol five_positions_v2: 1 Top-left at X=-35, Y=+35 mm; 2 Top-right at X=+35, Y=+35 mm; 3 Bottom-left at X=-35, Y=-35 mm; 4 Bottom-right at X=+35, Y=-35 mm; 5 Centre at X=0, Y=0 mm. All five marks lie inside the board outline. X increases right and Y increases upwards. Trace the inner square and both diagonals for the motion capture.</desc>
  <defs>
    <g id="target">
      <circle r="6" fill="white" stroke="#0a84ff" stroke-width="0.45"/>
      <path d="M-8 0 H8 M0 -8 V8" stroke="#0a84ff" stroke-width="0.25"/>
      <circle r="0.55" fill="#0a84ff"/>
    </g>
  </defs>
  <rect width="180" height="180" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1d1d1f">
    <text x="15" y="8.4" font-size="5" font-weight="700">Magnet baseline · five positions</text>
    <text x="15" y="12.2" font-size="2.8" fill="#6e6e73">Place on the cardboard · keep the board facing the same way</text>
    <rect x="15" y="15" width="150" height="150" fill="none" stroke="#1d1d1f" stroke-width="0.4"/>
    <text x="90" y="24" text-anchor="middle" font-size="4" font-weight="700" fill="#6e6e73">TOP</text>

    <!-- ±35 mm from the board centre: marked inner positions, not PCB edges. -->
    <g fill="none" stroke="#8db5d9" stroke-width="0.32">
      <path d="M55 55 H125 V125 H55 Z"/>
      <path d="M55 55 L125 125 M125 55 L55 125" stroke-width="0.22" stroke-dasharray="1.5 1.5"/>
    </g>

    <!-- Static order matches five_positions_v2 in magnet_evaluation.stages(). -->
    <use href="#target" x="55" y="55"/>
    <use href="#target" x="125" y="55"/>
    <use href="#target" x="55" y="125"/>
    <use href="#target" x="125" y="125"/>
    <use href="#target" x="90" y="90"/>

    <g text-anchor="middle" font-size="5.2" font-weight="700" fill="#174a78">
      <text x="55" y="43">1 · Top-left</text>
      <text x="125" y="43">2 · Top-right</text>
      <text x="55" y="141">3 · Bottom-left</text>
      <text x="125" y="141">4 · Bottom-right</text>
      <text x="90" y="78">5 · Centre</text>
    </g>

    <g text-anchor="middle" font-size="3.2" fill="#6e6e73">
      <text x="90" y="152">Hold still at 1 → 2 → 3 → 4 → 5</text>
      <text x="90" y="159">Sweep: around the square, then both diagonals · 10 s</text>
    </g>
    <path d="M15 167 V170 M165 167 V170 M15 168.5 H165" stroke="#63666b" stroke-width="0.2"/>
    <rect x="77" y="166.5" width="26" height="4" fill="white"/>
    <text x="90" y="169.5" text-anchor="middle" font-size="3" fill="#63666b">150 mm</text>
    <text x="90" y="176" text-anchor="middle" font-size="3" font-weight="700">Print at 100% / Actual size · verify the 150 × 150 mm outline</text>
  </g>
</svg>
