<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MagPilot Workcell Mask Lab</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212b;
      --muted: #65717f;
      --line: #cfd8e2;
      --panel: #ffffff;
      --soft: #eef4f8;
      --sky: #e7f3fb;
      --accent: #087f8c;
      --accent-dark: #05616b;
      --danger: #b4233d;
      --focus: #0a84ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--soft);
      color: var(--ink);
      font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      padding: 7px 11px;
    }

    button:hover {
      border-color: #9baaba;
      background: #f8fafc;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 30%, transparent);
      outline-offset: 2px;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }

    button.primary:hover {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    button.danger {
      color: var(--danger);
    }

    button.icon {
      width: 36px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    button[aria-pressed="true"] {
      border-color: var(--accent);
      background: #dff4f5;
      color: var(--accent-dark);
      font-weight: 700;
    }

    .appbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      min-height: 58px;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      min-width: 220px;
      align-items: center;
      gap: 10px;
      margin-right: 8px;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .spacer {
      flex: 1;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 286px;
      min-height: calc(100vh - 58px);
    }

    .stage {
      display: grid;
      min-width: 0;
      place-items: center;
      overflow: auto;
      padding: 18px;
      background:
        linear-gradient(45deg, #e2e8ee 25%, transparent 25%),
        linear-gradient(-45deg, #e2e8ee 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e2e8ee 75%),
        linear-gradient(-45deg, transparent 75%, #e2e8ee 75%);
      background-color: #f0f4f7;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-size: 20px 20px;
    }

    .canvas-shell {
      position: relative;
      width: min(100%, 1200px);
      border: 1px solid #aab7c4;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(31, 45, 61, 0.12);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
      touch-action: none;
    }

    .status {
      position: absolute;
      right: 8px;
      bottom: 8px;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 5px;
      background: rgba(14, 25, 36, 0.78);
      color: #ffffff;
      font: 11px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      pointer-events: none;
    }

    aside {
      overflow: auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
      padding: 15px;
    }

    .section {
      padding: 15px 0;
      border-bottom: 1px solid #e4e9ef;
    }

    .section:first-child {
      padding-top: 0;
    }

    .section:last-child {
      border-bottom: 0;
    }

    h2 {
      margin: 0 0 11px;
      color: #36424f;
      font-size: 12px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .tool-grid button {
      min-width: 0;
    }

    .field {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }

    .field label {
      font-weight: 650;
    }

    output {
      min-width: 48px;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .range {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--accent);
    }

    .color-row {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 9px;
      align-items: center;
    }

    input[type="color"] {
      width: 44px;
      height: 38px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      cursor: pointer;
    }

    .color-value {
      height: 38px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 9px;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      text-transform: uppercase;
    }

    .swatch {
      height: 34px;
      margin-top: 9px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--mask-color, #1d2835);
    }

    .export-stack {
      display: grid;
      gap: 7px;
    }

    .file-input {
      display: none;
    }

    .region-count {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .appbar {
        position: static;
        flex-wrap: wrap;
      }

      .brand {
        width: 100%;
      }

      .spacer {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      aside {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .stage {
        min-height: 52vh;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <h1>Workcell Mask Lab</h1>
        <small>embedded source · 1600 × 1200</small>
      </div>
    </div>
    <button id="newRegion" class="primary" title="Finish the current polygon and start a new region">+ Region</button>
    <button id="undo" class="icon" title="Undo the last point" aria-label="Undo the last point">↶</button>
    <button id="deleteRegion" class="icon danger" title="Delete the active region" aria-label="Delete the active region">⌫</button>
    <button id="clearAll" class="danger" title="Remove every mask region">Clear</button>
    <span class="spacer"></span>
    <button id="openImage" title="Open a different workcell image">Open image</button>
    <input id="imageFile" class="file-input" type="file" accept="image/*">
    <button id="downloadPreview" class="primary" title="Download the masked workcell image">Export preview</button>
  </header>

  <main class="workspace">
    <section class="stage" aria-label="Mask editing canvas">
      <div class="canvas-shell">
        <canvas id="canvas" width="1600" height="1200"></canvas>
        <div id="status" class="status">Loading workcell image…</div>
      </div>
    </section>

    <aside>
      <section class="section">
        <h2>Mask tools</h2>
        <div class="tool-grid">
          <button id="drawTool" aria-pressed="true" title="Add and drag polygon points">Polygon</button>
          <button id="sampleTool" aria-pressed="false" title="Click the workcell image to sample a color">Pick color</button>
        </div>
        <div class="field">
          <span>Regions</span>
          <output id="regionCount" class="region-count">0</output>
        </div>
      </section>

      <section class="section">
        <h2>Color</h2>
        <div class="color-row">
          <input id="maskColor" type="color" value="#253340" title="Mask color">
          <input id="colorValue" class="color-value" value="#253340" maxlength="7" aria-label="Mask color hex value">
        </div>
        <div id="swatch" class="swatch" title="Final mask color"></div>

        <div class="field">
          <label for="lightness">Lightness</label>
          <output id="lightnessValue" for="lightness">0</output>
          <input id="lightness" class="range" type="range" min="-60" max="60" value="0">
        </div>

        <div class="field">
          <label for="opacity">Opacity</label>
          <output id="opacityValue" for="opacity">82%</output>
          <input id="opacity" class="range" type="range" min="0" max="100" value="82">
        </div>

        <div class="field">
          <label for="feather">Edge softness</label>
          <output id="featherValue" for="feather">3 px</output>
          <input id="feather" class="range" type="range" min="0" max="30" value="3">
        </div>
      </section>

      <section class="section">
        <h2>View</h2>
        <div class="tool-grid">
          <button id="toggleMask" aria-pressed="true" title="Show or hide the mask">Mask on</button>
          <button id="togglePoints" aria-pressed="true" title="Show or hide polygon points">Points on</button>
        </div>
      </section>

      <section class="section">
        <h2>Export</h2>
        <div class="export-stack">
          <button id="downloadOverlay" title="Transparent PNG containing only the colored mask">Overlay PNG</button>
          <button id="copyConfig" title="Copy polygons and color settings as JSON">Copy settings</button>
        </div>
      </section>
    </aside>
  </main>

    const state = {
      regions: [],
      active: null,
      drag: null,
      mode: "draw",
      showMask: true,
      showPoints: true,
      color: "#253340",
      lightness: 0,
      opacity: 0.82,
      feather: 3
    };

    const ui = {
      status: document.getElementById("status"),
      regionCount: document.getElementById("regionCount"),
      drawTool: document.getElementById("drawTool"),
      sampleTool: document.getElementById("sampleTool"),
      maskColor: document.getElementById("maskColor"),
      colorValue: document.getElementById("colorValue"),
      swatch: document.getElementById("swatch"),
      lightness: document.getElementById("lightness"),
      lightnessValue: document.getElementById("lightnessValue"),
      opacity: document.getElementById("opacity"),
      opacityValue: document.getElementById("opacityValue"),
      feather: document.getElementById("feather"),
      featherValue: document.getElementById("featherValue"),
      toggleMask: document.getElementById("toggleMask"),
      togglePoints: document.getElementById("togglePoints")
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b]
        .map(value => clamp(Math.round(value), 0, 255).toString(16).padStart(2, "0"))
        .join("");
    }

    function adjustedColor() {
      const rgb = hexToRgb(state.color);
      const amount = Math.abs(state.lightness) / 100;
      const target = state.lightness < 0 ? 0 : 255;
      return rgbToHex(
        rgb.r + (target - rgb.r) * amount,
        rgb.g + (target - rgb.g) * amount,
        rgb.b + (target - rgb.b) * amount
      );
    }

    function setMode(mode) {
      state.mode = mode;
      ui.drawTool.setAttribute("aria-pressed", String(mode === "draw"));
      ui.sampleTool.setAttribute("aria-pressed", String(mode === "sample"));
      canvas.style.cursor = mode === "sample" ? "copy" : "crosshair";
      updateStatus();
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: clamp((event.clientX - rect.left) * canvas.width / rect.width, 0, canvas.width),
        y: clamp((event.clientY - rect.top) * canvas.height / rect.height, 0, canvas.height)
      };
    }

    function pointDistance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function hitPoint(point) {
      const radius = 14 * canvas.width / canvas.getBoundingClientRect().width;
      for (let regionIndex = state.regions.length - 1; regionIndex >= 0; regionIndex -= 1) {
        const region = state.regions[regionIndex];
        for (let pointIndex = region.length - 1; pointIndex >= 0; pointIndex -= 1) {
          if (pointDistance(point, region[pointIndex]) <= radius) {
            return { regionIndex, pointIndex };
          }
        }
      }
      return null;
    }

    function pathRegions(target) {
      for (const region of state.regions) {
        if (region.length < 3) continue;
        target.beginPath();
        target.moveTo(region[0].x, region[0].y);
        for (let index = 1; index < region.length; index += 1) {
          target.lineTo(region[index].x, region[index].y);
        }
        target.closePath();
        target.fill();
      }
    }

    function makeOverlay() {
      const overlay = document.createElement("canvas");
      overlay.width = canvas.width;
      overlay.height = canvas.height;
      const overlayContext = overlay.getContext("2d");

      if (!state.regions.some(region => region.length >= 3)) return overlay;

      const mask = document.createElement("canvas");
      mask.width = canvas.width;
      mask.height = canvas.height;
      const maskContext = mask.getContext("2d");
      maskContext.fillStyle = "#ffffff";
      pathRegions(maskContext);

      overlayContext.save();
      if (state.feather > 0) {
        overlayContext.filter = `blur(${state.feather}px)`;
      }
      overlayContext.drawImage(mask, 0, 0);
      overlayContext.restore();
      overlayContext.globalCompositeOperation = "source-in";
      overlayContext.globalAlpha = state.opacity;
      overlayContext.fillStyle = adjustedColor();
      overlayContext.fillRect(0, 0, overlay.width, overlay.height);
      overlayContext.globalAlpha = 1;
      overlayContext.globalCompositeOperation = "source-over";
      return overlay;
    }

    function drawGuides() {
      if (!state.showPoints) return;
      const displayScale = canvas.width / canvas.getBoundingClientRect().width;
      const lineWidth = 2 * displayScale;
      const radius = 6 * displayScale;

      state.regions.forEach((region, regionIndex) => {
        if (!region.length) return;
        ctx.beginPath();
        ctx.moveTo(region[0].x, region[0].y);
        for (let index = 1; index < region.length; index += 1) {
          ctx.lineTo(region[index].x, region[index].y);
        }
        if (region.length >= 3) ctx.closePath();
        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = region === state.active ? "#0a84ff" : "#ffffff";
        ctx.stroke();

        for (const point of region) {
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = region === state.active ? "#0a84ff" : "#ffffff";
          ctx.fill();
          ctx.lineWidth = lineWidth * 0.75;
          ctx.strokeStyle = "#18212b";
          ctx.stroke();
        }

        if (region.length) {
          ctx.fillStyle = "rgba(24, 33, 43, 0.82)";
          ctx.fillRect(region[0].x + 10, region[0].y - 24, 28, 20);
          ctx.fillStyle = "#ffffff";
          ctx.font = `${12 * displayScale}px ui-monospace, monospace`;
          ctx.fillText(String(regionIndex + 1), region[0].x + 19, region[0].y - 9);
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (image.complete && image.naturalWidth) {
        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      }
      if (state.showMask) {
        ctx.drawImage(makeOverlay(), 0, 0);
      }
      drawGuides();
      updateUi();
    }

    function updateUi() {
      const validRegions = state.regions.filter(region => region.length >= 3).length;
      ui.regionCount.value = String(validRegions);
      ui.lightnessValue.value = state.lightness > 0 ? `+${state.lightness}` : String(state.lightness);
      ui.opacityValue.value = `${Math.round(state.opacity * 100)}%`;
      ui.featherValue.value = `${state.feather} px`;
      ui.colorValue.value = state.color.toUpperCase();
      ui.swatch.style.setProperty("--mask-color", adjustedColor());
      ui.swatch.style.opacity = String(Math.max(0.12, state.opacity));
      updateStatus();
    }

    function updateStatus(message) {
      if (message) {
        ui.status.textContent = message;
        return;
      }
      const points = state.regions.reduce((count, region) => count + region.length, 0);
      const mode = state.mode === "sample" ? "COLOR SAMPLE" : "POLYGON";
      ui.status.textContent = `${mode} · ${state.regions.length} regions · ${points} points`;
    }

    function loadImage(source, revokeAfterLoad = false) {
      image.onload = () => {
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        draw();
        try {
          ctx.getImageData(0, 0, 1, 1);
          canvas.toDataURL("image/png");
          updateStatus(`${image.naturalWidth} × ${image.naturalHeight} · READY`);
        } catch {
          updateStatus("OPEN IMAGE TO ENABLE COLOR PICK + EXPORT");
        }
        if (revokeAfterLoad) URL.revokeObjectURL(source);
      };
      image.onerror = () => updateStatus("OPEN IMAGE TO BEGIN");
      image.src = source;
    }

    function startRegion() {
      if (state.active && state.active.length < 3) {
        return;
      }
      state.active = [];
      state.regions.push(state.active);
      setMode("draw");
      draw();
    }

    function sampleColor(point) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      const pixel = ctx.getImageData(Math.floor(point.x), Math.floor(point.y), 1, 1).data;
      state.color = rgbToHex(pixel[0], pixel[1], pixel[2]);
      ui.maskColor.value = state.color;
      setMode("draw");
      draw();
    }

    canvas.addEventListener("pointerdown", event => {
      canvas.setPointerCapture(event.pointerId);
      const point = canvasPoint(event);

      if (state.mode === "sample") {
        sampleColor(point);
        return;
      }

      const hit = hitPoint(point);
      if (hit) {
        state.active = state.regions[hit.regionIndex];
        state.drag = hit;
        draw();
        return;
      }

      if (!state.active) startRegion();
      state.active.push(point);
      draw();
    });

    canvas.addEventListener("pointermove", event => {
      if (!state.drag) return;
      const point = canvasPoint(event);
      state.regions[state.drag.regionIndex][state.drag.pointIndex] = point;
      draw();
    });

    canvas.addEventListener("pointerup", event => {
      state.drag = null;
      if (canvas.hasPointerCapture(event.pointerId)) {
        canvas.releasePointerCapture(event.pointerId);
      }
    });

    document.getElementById("newRegion").addEventListener("click", startRegion);
    document.getElementById("undo").addEventListener("click", () => {
      if (state.active && state.active.length) {
        state.active.pop();
        if (!state.active.length) {
          state.regions = state.regions.filter(region => region !== state.active);
          state.active = state.regions.at(-1) || null;
        }
      } else if (state.regions.length) {
        state.active = state.regions.at(-1);
        state.active.pop();
      }
      draw();
    });

    document.getElementById("deleteRegion").addEventListener("click", () => {
      if (!state.active) return;
      state.regions = state.regions.filter(region => region !== state.active);
      state.active = state.regions.at(-1) || null;
      draw();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      state.regions = [];
      state.active = null;
      draw();
    });

    ui.drawTool.addEventListener("click", () => setMode("draw"));
    ui.sampleTool.addEventListener("click", () => setMode("sample"));

    ui.maskColor.addEventListener("input", event => {
      state.color = event.target.value;
      draw();
    });

    ui.colorValue.addEventListener("change", event => {
      const value = event.target.value.trim();
      if (/^#[0-9a-f]{6}$/i.test(value)) {
        state.color = value.toLowerCase();
        ui.maskColor.value = state.color;
      }
      draw();
    });

    ui.lightness.addEventListener("input", event => {
      state.lightness = Number(event.target.value);
      draw();
    });

    ui.opacity.addEventListener("input", event => {
      state.opacity = Number(event.target.value) / 100;
      draw();
    });

    ui.feather.addEventListener("input", event => {
      state.feather = Number(event.target.value);
      draw();
    });

    ui.toggleMask.addEventListener("click", () => {
      state.showMask = !state.showMask;
      ui.toggleMask.setAttribute("aria-pressed", String(state.showMask));
      ui.toggleMask.textContent = state.showMask ? "Mask on" : "Mask off";
      draw();
    });

    ui.togglePoints.addEventListener("click", () => {
      state.showPoints = !state.showPoints;
      ui.togglePoints.setAttribute("aria-pressed", String(state.showPoints));
      ui.togglePoints.textContent = state.showPoints ? "Points on" : "Points off";
      draw();
    });

    document.getElementById("openImage").addEventListener("click", () => {
      document.getElementById("imageFile").click();
    });

    document.getElementById("imageFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) loadImage(URL.createObjectURL(file), true);
    });

    function downloadCanvas(sourceCanvas, filename) {
      sourceCanvas.toBlob(blob => {
        if (!blob) return;
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 500);
      }, "image/png");
    }

    document.getElementById("downloadOverlay").addEventListener("click", () => {
      downloadCanvas(makeOverlay(), "workcell_mask_overlay.png");
    });

    document.getElementById("downloadPreview").addEventListener("click", () => {
      const preview = document.createElement("canvas");
      preview.width = canvas.width;
      preview.height = canvas.height;
      const previewContext = preview.getContext("2d");
      previewContext.drawImage(image, 0, 0, preview.width, preview.height);
      previewContext.drawImage(makeOverlay(), 0, 0);
      downloadCanvas(preview, "workcell_mask_preview.png");
    });

    document.getElementById("copyConfig").addEventListener("click", async event => {
      const data = {
        image: `${canvas.width}x${canvas.height}`,
        color: state.color,
        adjustedColor: adjustedColor(),
        lightness: state.lightness,
        opacity: state.opacity,
        feather: state.feather,
        regions: state.regions
          .filter(region => region.length >= 3)
          .map(region => region.map(point => [Math.round(point.x), Math.round(point.y)]))
      };
      const text = JSON.stringify(data, null, 2);
      try {
        await navigator.clipboard.writeText(text);
        event.currentTarget.textContent = "Settings copied";
      } catch {
        window.prompt("Copy mask settings", text);
      }
      setTimeout(() => {
        event.currentTarget.textContent = "Copy settings";
      }, 1400);
    });

    window.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
        event.preventDefault();
        document.getElementById("undo").click();
      }
      if (event.key === "Escape") {
        state.active = null;
        draw();
      }
    });

    loadImage(DEFAULT_IMAGE);
  </script>
</body>
</html>
